{% extends 'base.html' %}

{% block content %}
<h1>Удалить продукт: {{ object.name }}</h1>
<p>Вы уверены, что хотите удалить этот продукт?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'product_list' %}">Отмена</a>
</form>
{% endblock %}
