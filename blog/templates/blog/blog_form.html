{% extends 'base.html' %}

{% block content %}
<h1>{% if form.instance.pk %}Редактировать статью{% else %}Создать статью{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
<a href="{% url 'blog_list' %}">Назад к списку статей</a>
{% endblock %}
